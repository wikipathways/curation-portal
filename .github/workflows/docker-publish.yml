name: Build and Publish Container Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GHCR_USER/GHCR_TOKEN when the package namespace is not this repository's owner
          # (see the tags below); GITHUB_TOKEN otherwise. A workflow token's permissions stop
          # at its own repository, so it cannot write a package owned by somebody else.
          username: ${{ secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Pinned to marvinm2 rather than github.repository_owner. This repository moved to
          # the wikipathways org on 2026-08-20, and deriving the namespace from the owner would
          # have silently started publishing to ghcr.io/wikipathways/..., which defaults to
          # private -- so the swarm service pulling this image would have failed on both nodes.
          # Renaming the package is worth doing, but as its own change with a redeploy beside
          # it, not as a side effect of moving the repository.
          tags: |
            ghcr.io/marvinm2/wikipathways-submit:latest
            ghcr.io/marvinm2/wikipathways-submit:${{ github.sha }}
