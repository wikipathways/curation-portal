[project]
name = "curation-portal"
version = "0.0.1"
description = "Submission and curation front door for GitHub-based WikiPathways"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",   # form uploads
    "jinja2>=3.1",                # server-rendered templates
    "itsdangerous>=2.1",          # signs the session cookie (SessionMiddleware)
    "pyjwt[crypto]>=2.8",         # RS256 JWT for the GitHub App (bot) identity
    "alembic>=1.13",              # database migrations (production; dev uses create_all)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "cryptography>=42.0",         # generate a throwaway RSA key in the GitHub App tests
]
postgres = [
    "psycopg[binary]>=3.1",       # PostgreSQL driver for the production datastore
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-autogenerated revisions are machine-written; don't lint their formatting.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are call-in-default by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
